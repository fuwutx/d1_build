name: Build Lichee RV Debian Linux Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'

jobs:
  build-lichee-rv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static qemu-system qemu-utils binfmt-support

      - name: Prepare Directories
        run: |
          mkdir -p lichee_rv_dock

      - name: Build Docker Container
        run: |
          export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
          docker compose build dock

      - name: Create Lichee RV Dock Image
        run: |
          export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
          docker compose up dock
          ls -lh lichee_rv_dock/

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lichee_rv_dock_debian_image
          path: lichee_rv_dock/*.img.xz
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            lichee_rv_dock/*.img.xz
            README.txt

